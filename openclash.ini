; ==========================================================
; OpenClash Meta metafenliu.ini
; iStoreOS 主路由分流模板
; ==========================================================


[custom]


enable_rule_generator=true
overwrite_original_rules=true


; ==========================================================
; 节点过滤
; ==========================================================

exclude=流量|套餐|到期|剩余|重置|官网|网站|公告|通知|订阅|Expire|Traffic|Reset



; ==========================================================
; 分流规则
; ==========================================================


; 私网
ruleset=DIRECT,[]GEOSITE,private
ruleset=DIRECT,[]GEOIP,private,no-resolve


; 国内
ruleset=DIRECT,[]GEOSITE,cn
ruleset=DIRECT,[]GEOIP,cn,no-resolve


; Apple
ruleset=🤖 ChatGPT,[]DOMAIN,guzzoni.apple.com
ruleset=🤖 ChatGPT,[]DOMAIN-SUFFIX,smoot.apple.com
ruleset=🤖 ChatGPT,[]DOMAIN-SUFFIX,apple-relay.cloudflare.com
ruleset=🤖 ChatGPT,[]DOMAIN-SUFFIX,apple-relay.fastly-edge.com
ruleset=🤖 ChatGPT,[]DOMAIN-SUFFIX,cp4.cloudflare.com
ruleset=🤖 ChatGPT,[]DOMAIN,apple-relay.apple.com
ruleset=🍎 Apple,[]GEOSITE,apple


; Google
ruleset=🔎 Google,[]GEOSITE,google
ruleset=🔎 Google,[]GEOIP,google,no-resolve


; YouTube
ruleset=🎬 YouTube,[]GEOSITE,youtube


; ==========================================================
; AI 专用分流
; ==========================================================

; ChatGPT / OpenAI
ruleset=🤖 ChatGPT,[]DOMAIN-SUFFIX,openai.com
ruleset=🤖 ChatGPT,[]DOMAIN-SUFFIX,openai.org
ruleset=🤖 ChatGPT,[]DOMAIN-SUFFIX,chatgpt.com
ruleset=🤖 ChatGPT,[]GEOSITE,openai


; Gemini / Google AI
ruleset=🧠 AI,[]DOMAIN-SUFFIX,gemini.google.com
ruleset=🧠 AI,[]DOMAIN-SUFFIX,ai.google
ruleset=🧠 AI,[]DOMAIN-SUFFIX,aistudio.google.com
ruleset=🧠 AI,[]DOMAIN-SUFFIX,ai.google.dev
ruleset=🧠 AI,[]DOMAIN-SUFFIX,generativelanguage.googleapis.com


; Claude
ruleset=🧠 AI,[]DOMAIN-SUFFIX,claude.ai
ruleset=🧠 AI,[]DOMAIN-SUFFIX,anthropic.com


; Perplexity
ruleset=🧠 AI,[]DOMAIN-SUFFIX,perplexity.ai


; Grok
ruleset=🧠 AI,[]DOMAIN-SUFFIX,grok.com
ruleset=🧠 AI,[]DOMAIN-SUFFIX,x.ai


; Microsoft Copilot
ruleset=🧠 AI,[]DOMAIN-SUFFIX,copilot.microsoft.com


; AI Studio / AI API
ruleset=🧠 AI,[]DOMAIN-SUFFIX,makersuite.google.com


; 其他 AI
ruleset=🧠 AI,[]GEOSITE,category-ai-!cn


; Telegram
ruleset=📨 Telegram,[]GEOSITE,telegram
ruleset=📨 Telegram,[]GEOIP,telegram,no-resolve


; Netflix
ruleset=🎥 Netflix,[]GEOSITE,netflix
ruleset=🎥 Netflix,[]GEOIP,netflix,no-resolve


; GitHub
ruleset=🛠 GitHub,[]GEOSITE,github


; Microsoft
ruleset=🪟 Microsoft,[]GEOSITE,microsoft


; Steam
ruleset=🎮 Steam,[]GEOSITE,steam


; TikTok
ruleset=🎵 TikTok,[]GEOSITE,tiktok


; Twitter
ruleset=🐦 X,[]GEOSITE,twitter


; GFW
ruleset=🚀 手动选择,[]GEOSITE,gfw


; 最终
ruleset=🐟 漏网之鱼,[]FINAL




; ==========================================================
; 节点地区测速
; ==========================================================


custom_proxy_group=♻️ 自动选择`url-test`.*`http://www.gstatic.com/generate_204`300,,50


custom_proxy_group=🇭🇰 HK`url-test`(?i)(香港|HK|Hong|Hongkong|🇭🇰)`http://www.gstatic.com/generate_204`300,,50


custom_proxy_group=🇯🇵 JP`url-test`(?i)(日本|JP|Japan|Tokyo|Osaka|🇯🇵)`http://www.gstatic.com/generate_204`300,,50


custom_proxy_group=🇸🇬 SG`url-test`(?i)(新加坡|SG|Singapore|🇸🇬)`http://www.gstatic.com/generate_204`300,,50


custom_proxy_group=🇺🇸 US`url-test`(?i)(美国|US|USA|America|Los Angeles|🇺🇸)`http://www.gstatic.com/generate_204`300,,50




; ==========================================================
; 全部节点
; ==========================================================


custom_proxy_group=🌐 全部节点`select`.*




; ==========================================================
; 应用策略组
; ==========================================================


custom_proxy_group=🤖 ChatGPT`select`[]🇭🇰 HK`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]♻️ 自动选择`[]🌐 全部节点`[]🌐 Default


custom_proxy_group=🧠 AI`select`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]♻️ 自动选择`[]🌐 全部节点`[]🌐 Default


custom_proxy_group=📨 Telegram`select`[]🇭🇰 HK`[]🇸🇬 SG`[]🇯🇵 JP`[]🇺🇸 US`[]♻️ 自动选择`[]🌐 全部节点`[]🌐 Default


custom_proxy_group=🎬 YouTube`select`[]🇭🇰 HK`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]♻️ 自动选择`[]🌐 全部节点`[]🌐 Default


custom_proxy_group=🎥 Netflix`select`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]♻️ 自动选择`[]🌐 全部节点`[]🌐 Default


custom_proxy_group=🔎 Google`select`[]🇭🇰 HK`[]🇯🇵 JP`[]🇺🇸 US`[]♻️ 自动选择`[]🌐 全部节点`[]🌐 Default


custom_proxy_group=🍎 Apple`select`[]DIRECT`[]🇭🇰 HK`[]🇯🇵 JP`[]🌐 全部节点`[]🌐 Default


custom_proxy_group=🪟 Microsoft`select`[]DIRECT`[]🇭🇰 HK`[]🇺🇸 US`[]🌐 全部节点`[]🌐 Default


custom_proxy_group=🛠 GitHub`select`[]🇭🇰 HK`[]🇯🇵 JP`[]🇺🇸 US`[]♻️ 自动选择`[]🌐 全部节点`[]🌐 Default


custom_proxy_group=🎮 Steam`select`[]DIRECT`[]🇭🇰 HK`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]♻️ 自动选择`[]🌐 全部节点`[]🌐 Default


custom_proxy_group=🎵 TikTok`select`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🌐 全部节点`[]🌐 Default


custom_proxy_group=🐦 X`select`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🌐 全部节点`[]🌐 Default




; ==========================================================
; 默认出口
; ==========================================================


custom_proxy_group=🚀 手动选择`select`[]♻️ 自动选择`[]🇭🇰 HK`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🌐 全部节点`[]DIRECT


custom_proxy_group=🌐 Default`select`[]♻️ 自动选择`[]🇭🇰 HK`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🌐 全部节点`[]🚀 手动选择`[]DIRECT


custom_proxy_group=🐟 漏网之鱼`select`[]🌐 Default`[]🚀 手动选择`[]🌐 全部节点`[]DIRECT

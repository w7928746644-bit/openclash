; ==========================================================
; 15) 国家节点测速组
; ==========================================================


; ----------------------------------------------------------
; 所有节点手动选择
; ----------------------------------------------------------

custom_proxy_group=🌐 全部节点`select`.*


; ----------------------------------------------------------
; 所有节点自动测速
; ----------------------------------------------------------

custom_proxy_group=♻️ 自动选择`url-test`.*`https://www.gstatic.com/generate_204`300,,50


; ----------------------------------------------------------
; 香港
; ----------------------------------------------------------

custom_proxy_group=🇭🇰 HK`url-test`(?i)(🇭🇰|香港|\\bHK\\b|hongkong)`http://www.gstatic.com/generate_204`300,,50


; ----------------------------------------------------------
; 台湾
; ----------------------------------------------------------

custom_proxy_group=🇹🇼 TW`url-test`(?i)(🇹🇼|台湾|\\bTW\\b|taiwan|taipei|hinet)`http://www.gstatic.com/generate_204`300,,50


; ----------------------------------------------------------
; 日本
; ----------------------------------------------------------

custom_proxy_group=🇯🇵 JP`url-test`(?i)(🇯🇵|日本|\\bJP\\b|japan|tokyo|osaka)`http://www.gstatic.com/generate_204`300,,50


; ----------------------------------------------------------
; 新加坡
; ----------------------------------------------------------

custom_proxy_group=🇸🇬 SG`url-test`(?i)(🇸🇬|新加坡|\\bSG\\b|singapore)`http://www.gstatic.com/generate_204`300,,50


; ----------------------------------------------------------
; 美国
; ----------------------------------------------------------

custom_proxy_group=🇺🇸 US`url-test`(?i)(🇺🇸|美国|\\bUS\\b|united states|america|los angeles|san jose|seattle|new york)`http://www.gstatic.com/generate_204`300,,50


; ----------------------------------------------------------
; 冷门节点
; 排除 HK / JP / TW / US / SG
; ----------------------------------------------------------

custom_proxy_group=🧊 冷门节点`select`(?i)^(?!.*(🇭🇰|香港|\\bHK\\b|hong\\s*kong|🇯🇵|日本|\\bJP\\b|japan|tokyo|osaka|🇹🇼|台湾|\\bTW\\b|taiwan|taipei|hinet|🇸🇬|新加坡|\\bSG\\b|singapore|🇺🇸|美国|\\bUS\\b|united\\s*states|america|los\\s*angeles|san\\s*jose|seattle|new\\s*york)).*



; ==========================================================
; END
; ==========================================================

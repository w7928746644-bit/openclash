custom_proxy_group=🎮 Steam`select`[]DIRECT`[]🇭🇰 HK`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]♻️ 自动选择`[]🌐 全部节点`[]🌐 Default

; ==========================================================
; 默认出口
; ==========================================================

custom_proxy_group=🚀 手动选择`select`[]♻️ 自动选择`[]🇭🇰 HK`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🌐 全部节点`[]DIRECT

custom_proxy_group=🌐 Default`select`[]♻️ 自动选择`[]🇭🇰 HK`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🌐 全部节点`[]🚀 手动选择`[]DIRECT

